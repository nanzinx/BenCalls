name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Testes (regras, entrada e servidor)
        run: npm test
      - run: npm run build
      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: verificar
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem endurecida
        run: docker build --build-arg VERSAO=${GITHUB_SHA::7} -t bencalls:ci .
      - name: Sobe e confere o healthcheck e o endurecimento
        run: |
          docker run -d --name bencalls --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /run/bencalls:uid=1000,gid=1000,mode=0700 --tmpfs /tmp:uid=1000,gid=1000,mode=0700 \
            -p 127.0.0.1:8080:8080 bencalls:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' bencalls)" = healthy ] && break; sleep 2
          done
          docker inspect --format '{{.State.Health.Status}}' bencalls | grep -q healthy
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "content-security-policy"
          test "$(docker exec bencalls id -u)" = "1000"
      - name: Varredura de vulnerabilidades (Trivy)
        # Fixado pelo commit (v0.36.0): as tags antigas sem "v" deixaram de existir.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: bencalls:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
